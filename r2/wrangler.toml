# The image Worker. Contains NO secrets: the R2 binding is granted by the
# platform, and UPLOAD_SECRET is set with `wrangler secret put` so it never
# appears in this file or in git.
#
#   npx wrangler deploy --config r2/wrangler.toml
#   npx wrangler secret put UPLOAD_SECRET --config r2/wrangler.toml
#
name = "bedtime-images"
main = "worker.js"
compatibility_date = "2026-10-01"

# Created with:  npx wrangler r2 bucket create bedtime-images
# R2's free allowance is 10 GB of storage and 1,000,000 class-B operations a
# month. The 879 files BEDTIME actually references come to 220 MB, which is
# 2.2% of it, and reads are served from Cloudflare's cache rather than R2 for
# anything already seen.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "bedtime-images"

[vars]
ALLOWED_ORIGINS = "https://bedtimehome.com,https://www.bedtimehome.com,https://admin.bedtimehome.com"

# Read-through origin. A GET for a key R2 does not hold is fetched from here,
# served, and copied into the bucket in the background.
#
# This is what makes switching VITE_IMAGE_HOST safe: the apps still upload new
# product photos to Supabase Storage, so without a fallback every photo added
# after the migration would be a broken image on the shop floor. It also
# closes any gap the bulk copy left.
#
# Only the public object path is reachable, and only when the response is one
# of the four allowed image types, so this cannot become an open proxy.
# Clear it to make a miss a hard 404 again.
# Where a staff session is checked. Without this the Worker fell back to
# ORIGIN_BASE -- the OLD Supabase project -- and asked the wrong server
# whether the token was valid.
AUTH_BASE = "https://api.bedtimehome.com"
# Read-through origin for images not yet copied into R2. Still the old
# project on purpose: that is where those bytes are.
ORIGIN_BASE = "https://wqkgfvmvuljzexhevlnp.supabase.co"
ORIGIN_BUCKET = "product-images"

# Per-project DEPLOYMENT PUBLIC keys, as a JSON object. Public keys are not
# secrets -- they are precisely what gets installed, and publishing one grants
# nothing without the matching private key, which never leaves the project's
# own machine.
#
# A new project joins by adding one entry here and redeploying. That is the
# whole of the access procedure that has blocked every migration so far.
#
# This must stay inside [vars]: a bare key after a [[rules]] table would be
# parsed as part of that table instead, which is how it was lost once.
DEPLOY_KEYS = '{"bedtime":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEe6NRO3thxOFzhMKuwsqL/Wk5hwp1oi1QTghS3VDPuJ bedtime-migration@Isaacs-MacBook-Pro-20261121"}'

# Bundle the deployment-account installer as text, so /deploy-access serves
# the same bytes that are reviewable in deploy/access/install-deploy-account.sh
# and the two cannot drift apart.
[[rules]]
type = "Text"
globs = ["**/*.sh"]
fallthrough = true

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BEDTIME BEDDINGS">
  <meta property="og:title" content="BEDTIME BEDDINGS & HOME">
  <meta property="og:description" content="Staff point-of-sale for BEDTIME BEDDINGS & HOME.">
  <meta property="og:image" content="https://admin.bedtimehome.com/og-image.png">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>BEDTIME BEDDINGS & HOME POS</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Not in the desktop app: it loads from file://, where registration
    // throws anyway, and a worker caching the bundle would serve stale
    // assets after an update installs.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((reg) => {
          // Registering is not the same as checking. An installed PWA can run
          // the same worker for days, and while CACHE_NAME was a fixed string
          // sw.js never changed, so no new worker was ever installed and the
          // old cache kept serving a stale bundle. Ask explicitly, on every
          // launch and whenever the till is brought back to the foreground.
          const check = () => { try { reg.update() } catch (e) { /* offline */ } }
          check()
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') check()
          })
          setInterval(check, 30 * 60 * 1000)

          // Checking for an update is not the same as applying one.
          //
          // A worker that finished installing waits for every page running the
          // old one to go away -- which, on a till that is open all day, is
          // never. sw.js calls skipWaiting() on install, but a worker put into
          // `waiting` by an OLDER build has no such code, so it sits there for
          // good. That is exactly what the shop's Safari was doing: an update
          // downloaded, installed, waiting, while the page ran a bundle several
          // deploys old. No amount of reloading fixes it, which is why it
          // looked like the app simply would not update.
          //
          // So ask the waiting worker to step aside -- but ONLY when the till
          // is idle. window.__posBusy is kept true by the app while a sale is
          // open or the cart has anything in it, because activating swaps the
          // worker and reloads the page, and doing that mid-checkout would
          // cost the transaction.
          //
          // The message only reaches a worker that KNOWS about it, and the
          // worker that is stuck was installed by a build that predates the
          // handler. Verified in the shop's Safari: the page took the new HTML
          // and the new bundle over the network, posted SKIP_WAITING, and the
          // old worker carried on waiting because nothing was listening.
          //
          // So after a couple of attempts, drop the registration entirely. A
          // fresh worker installs on the next load and its own skipWaiting()
          // works normally. unregister() touches only the worker -- it does
          // not clear localStorage, so held carts, the register id and staff
          // settings all survive, and the caches left behind are deleted by
          // the new worker's activate step.
          let unstick = 0
          const applyIfIdle = () => {
            const w = reg.waiting
            if (!w || window.__posBusy) return
            try { w.postMessage({ type: 'SKIP_WAITING' }) } catch (e) { /* gone */ }
            if (++unstick < 2) return
            reg.unregister().then((gone) => {
              if (gone && !window.__posBusy) window.location.reload()
            }).catch(() => {})
          }
          applyIfIdle()
          reg.addEventListener('updatefound', () => {
            const fresh = reg.installing
            if (!fresh) return
            fresh.addEventListener('statechange', () => {
              if (fresh.state === 'installed') applyIfIdle()
            })
          })
          // Retry, so an update that arrived mid-sale lands once the till is
          // free rather than waiting for the next launch.
          setInterval(applyIfIdle, 60 * 1000)
        }).catch(() => {})

        // When a NEW worker replaces an existing one, this page is still
        // running the old bundle, so reload once. Only when one was already
        // in control: on a first install the same event fires and a reload
        // there would just be a pointless flicker for a new visitor.
        const hadController = !!navigator.serviceWorker.controller
        let reloaded = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || reloaded) return
          reloaded = true
          window.location.reload()
        })
      })
    }
  </script>
</body>
</html>

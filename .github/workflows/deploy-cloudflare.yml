name: Deploy to Cloudflare Pages

# Both sites are built and published from this workflow rather than from
# Cloudflare's dashboard build settings, so the build that ships is the one the
# tests ran against, and the configuration lives in the repository.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   the account the Pages projects belong to

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false      # never cancel a half-finished deploy of a live shop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      # The same gates as CI. A shop front that fails its tests does not ship.
      - name: Lint
        run: npx eslint src
      - name: Tests
        run: npm test

      - name: Build the POS
        run: npm run build

      - name: Build the shop front
        working-directory: storefront
        run: |
          npm install --no-audit --no-fund
          npx eslint src
          npm run build

      - name: No server secrets in either bundle
        shell: bash
        run: |
          set -e
          for pat in TIKTOK_CLIENT_SECRET SUPABASE_SERVICE_ROLE_KEY NALOPAY_API_KEY MNOTIFY_KEY OPENAI_API_KEY service_role sk-proj-; do
            for bundle in dist/assets storefront/dist/assets; do
              if grep -rq "$pat" "$bundle"/*.js 2>/dev/null; then
                echo "::error::'$pat' found in $bundle"; exit 1
              fi
            done
          done
          echo "clean"

      # Routing and caching rules are files in the build output; without them
      # Pages answers a deep link with 404 and pins an old service worker.
      - name: Routing and caching rules shipped
        shell: bash
        run: |
          set -e
          for f in dist/_redirects dist/_headers storefront/dist/_redirects storefront/dist/_headers; do
            test -s "$f" || { echo "::error::$f missing from the build output"; exit 1; }
          done
          grep -q '/index.html' dist/_redirects
          grep -q '/index.html' storefront/dist/_redirects
          echo "present"

      # Without the two secrets wrangler cannot authenticate, and the whole run
      # goes red on every push even though the build and the tests were fine.
      # Check once, up front, and say plainly what is missing.
      - name: Are the Cloudflare credentials configured?
        id: creds
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing=""
            [ -z "$TOKEN" ] && missing="CLOUDFLARE_API_TOKEN"
            [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
            echo "::warning title=Not published::Built and verified, but nothing was deployed: repository secret(s) missing ->$missing. Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
          fi

      - name: Publish the POS
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bedtime-admin --branch=main

      - name: Publish the shop front
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: storefront
          command: pages deploy dist --project-name=bedtime-shop --branch=main

      # The deploy is only real once Pages has actually served the new build.
      - name: Both sites answer
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          for url in https://bedtimehome.com/ https://admin.bedtimehome.com/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 5 --max-time 30 "$url")
            [ "$code" = "200" ] || { echo "::error::$url answered $code"; exit 1; }
            echo "$url -> 200"
          done

name: Build Windows POS installer

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'package.json', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Package the Windows installer
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Show what was produced
        working-directory: desktop
        shell: bash
        run: ls -la release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BEDTIME-POS-installer
          path: desktop/release/*.exe
          retention-days: 90

      # A release asset on a public repo is a plain download link, which is the
      # simplest way to get the installer onto a till that has no dev tooling.
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: BEDTIME POS desktop (build ${{ github.run_number }})
          body: |
            Windows installer for the POS terminals.

            Download `BEDTIME-POS-Setup-1.0.0.exe`, run it on the till, then open
            **menu -> Receipt Printer** and press **Print test page**.

            Built from ${{ github.sha }}.
          files: desktop/release/*.exe
          draft: false
          prerelease: false
